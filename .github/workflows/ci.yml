name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run tokens
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run boundaries
      - run: npm run build
      - run: npm run check:bundle

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: peach_finder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peach_finder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:secret@127.0.0.1:5432/peach_finder
      DATABASE_URL_MIGRATE: postgres://postgres:secret@127.0.0.1:5432/peach_finder
      PUBLIC_APP_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            testing/playwright/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: testing/playwright
      - run: npx playwright install --with-deps chromium
        working-directory: testing/playwright
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
